# 開発用の PostgreSQL 16 (認証機能の設計 7.6)
# 起動の前に、POSTGRES_PASSWORD (app_owner) と APP_DB_PASSWORD (app_user) を環境変数で設定してください。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を設定してください}
      # init.sql が app_user を作るときに使う (バックエンドの APP_DB_PASSWORD と同じ値)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD を設定してください}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
